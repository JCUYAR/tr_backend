services:
  backend:
    build:
      context: .
    container_name: nestjs-tareo-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: mi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: decimo11
      MYSQL_DATABASE: tareomysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: